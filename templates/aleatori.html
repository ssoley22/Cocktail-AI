<!DOCTYPE html>             
<html lang="ca">         
<head>                       
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="/static/css/style.css"> 
    <title>Cocktail IA - Aleatori</title>   
    <style>
       
        .icona-flotant {
            font-size: 6rem;
            margin-bottom: 10px;
            display: inline-block; /* Serveix perquè pugui rotar */
            
            /* Cridem dues animacions alhora amb temps diferents */
            animation: 
                surar 1s ease-in-out infinite alternate,
                balancejar 2s ease-in-out infinite alternate;
        }

        /* Animació 1: Només s'ocupa d'anar amunt i avall */
        @keyframes surar {
            0%   { translate: 0 0px; }
            100% { translate: 0 -20px; }
        }

        /* Animació 2: Només s'ocupa de rotar cap als costats */
        @keyframes balancejar {
            0%   { rotate: -8deg; }
            100% { rotate: 8deg; }
        }

        h1 {
            font-size: 2.8rem;
        }

        .subtext {
            color: var(--color-text-subtil);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 3px;
        }

        .desc {
            color: var(--color-text-subtil);
            font-style: italic;
            margin-top: 20px;
        }

        .grup-botons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 60px;
        }

        .btn-si {
            background: var(--color-primari);
            color: var(--color-text);
            padding: 15px 30px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 1.4rem;
            transition: 0.3s;
        }

        .btn-si:hover {
            background: var(--color-primari-clar);
            transform: scale(1.03);
        }

        .btn-refresh {
            background: var(--color-superficie-claret);
            color: var(--color-primari);
            padding: 15px 30px;
            border-radius: 20px;
            border: 2px solid var(--color-vora);
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
        }
    </style>


</head>
<body>
    <div class="main-container">
        <div class="top-bar">
            <a href="/" class="tornar-btn">← Tornar</a>
        </div>

        <div class="container">
            <div class="icona-flotant">🎲</div>
            <p class="subtext"> La teva sorpresa és:</p>
            <h1>{{ coctel.Nom_Coctel }}</h1>
            <p class="desc">"{{ coctel.Descripcio if coctel.Descripcio else "L'atzar ha parlat. T'atreveixes a provar aquesta combinació?" }}"</p>
            
            <div class="grup-botons">
                <a href="/confirmacio/{{ coctel.ID_Coctel }}?origen=/aleatori" class="btn-si">✅ M'agrada, aquest!</a>
                <a href="/aleatori" class="btn-refresh">Prova sort de nou</a>
            </div>
        </div>
    </div>
</body>
</html>
