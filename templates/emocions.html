<!DOCTYPE html>             
<html lang="ca">         
<head>                       
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="/static/css/style.css"> 
    <title>Cocktail IA - Emocions</title>   
    <style>
        .cuadricula-botons {
            grid-template-columns: 1fr 1fr 1fr 1fr; /* Quatre columnes de la mateixa mida */
            max-width: 900px;
            width: 90%;
            margin-bottom: auto;
        }

        .boto.emocions {
            background: var(--color-superficie-2);
            align-items: center;
            text-align: center;
            border-radius: 35px;
        }

        .boto.emocions .emoji {
            font-size: 5rem;
            filter: grayscale(40%);
            transition: 0.3s;
        }

        .boto.emocions .nom-emocio {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--color-text-subtil);
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .boto.emocions:hover {
            transform: translateY(-20px);
            
        }

        .boto.emocions:hover .emoji {
            filter: grayscale(0);
            transform: scale(1.15);
        }

        .boto.emocions:hover .nom-emocio {
            color: white;
        }

        .boto.emocions.alegre:hover {
            border-color: var(--color-alegria);
            background: var(--color-alegria-difuminat);
        }

        .boto.emocions.trist:hover {
            border-color: var(--color-tristesa);
            background: var(--color-tristesa-difuminat);
        }

        .boto.emocions.estressat:hover {
            border-color: var(--color-estres);
            background: var(--color-estres-difuminat);
        }

        .boto.emocions.enfadat:hover {
            border-color: var(--color-enfadat);
            background: var(--color-enfadat-difuminat);
        }

        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 60px;
            margin-top: 20vh;
        }

        /* ANIMACIÓ DE LA IA: */
        .ia-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.95);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
        }

        .ia-spinner {
            font-size: 6rem;
            animation: pulseIA 1s infinite alternate ease-in-out;
        }

        @keyframes pulseIA {
            from { transform: scale(0.9); opacity: 0.6; }
            to   { transform: scale(1.15); opacity: 1; }
        }

        .progress-bar-container {
            width: 280px; height: 4px;
            background: var(--color-vora);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%; width: 40%;
            background: var(--color-primari);
            border-radius: 10px;
            animation: slide 1.5s ease-in-out infinite;
        }

        @keyframes slide {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }
    </style>


</head>
<body>
    <div class="main-container">
        <div class="top-bar">
            <a href="/" class="tornar-btn">← Tornar</a>
        </div>
        <h1>Com et sents avui?</h1>
        <div class="cuadricula-botons">
            <a href="/recomanacio/alegre" class="boto emocions alegre">
                <div class="emoji">😄</div>
                <div class="nom-emocio">ALEGRE</div>
            </a>
            <a href="/recomanacio/trist" class="boto emocions trist">
                <div class="emoji">😢</div>
                <div class="nom-emocio">TRIST</div>
            </a>
            <a href="/recomanacio/estressat" class="boto emocions estressat">
                <div class="emoji">😫</div>
                <div class="nom-emocio">ESTRESSAT</div>
            </a>
            <a href="/recomanacio/enfadat" class="boto emocions enfadat">
                <div class="emoji">😡</div>
                <div class="nom-emocio">ENFADAT</div>
            </a>
        </div>
        
    </div>

    <div id="ia-loading" class="ia-overlay">
        <div class="ia-spinner">🪄</div>
        <h2>Processant Emocions...</h2>
        <p style="color: var(--color-text-subtil);">La IA està buscant la teva beguda ideal</p>
        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.boto.emocions').forEach(boto => {
            boto.addEventListener('click', function() {
                document.getElementById('ia-loading').style.display = 'flex';
            });
        });
    </script>

</body>
</html>
