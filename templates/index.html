<!DOCTYPE html>             
<html lang="ca">         
<head>                       
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="/static/css/style.css"> 
    <title>Cocktail IA - Inici</title>   
    <style>
        .icona {
            font-size: 4rem; /* 4 cops la mida normal*/
        }

        h1 {
            font-family: 'Momo Signature', cursive; /* Per tenir el text normal esborrar aquesta linia i posar el spacing a 5px */
            letter-spacing: 0px;
            font-size: clamp(2.5rem, 10vw, 4rem); /* Dinàmic: s'adapta a la pantalla */
            text-shadow: 0 0 50px var(--ombra-primari); /* Afegeix una ombra al text */
            margin: 0;
        }

        .btn-admin {
            align-self: flex-end;
            font-size: 2.2rem;
            text-decoration: none;
            opacity: 0.25; 
            transition: 0.4s;
        }
        
        .btn-admin:hover {
            opacity: 1;
            transform: rotate(90deg); /* Animació en passar-hi per sobre */
        }

        .separador {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 550px; /* Evita que creixi infinitament */
        }
        
        .linia {
            height: 2px;
            flex: 1; 
            background: var(--color-vora);
        }
        
        .separador-text {
            color: var(--color-text-subtil);
            font-size: 0.9rem;
            letter-spacing: 5px;
            font-weight: bold;
            text-transform: uppercase; /* Força majúscules */
        }

        .boto:hover {  /* Quan está el ratolí sobre el botó */
            border-color: var(--color-primari);
            background: var(--color-superficie-claret); 
            transform: translateY(-5px);
            box-shadow: 0 5px 20px var(--ombra-primari-suau);
        }

        .boto-icona {
            background: var(--color-icona-bg); 
            border-radius: 15px;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0; /* Evita que la icona es redueixi */
        }

        .boto-nom {
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .boto-desc {
            color: var(--color-text-subtil);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .boto-text {
            display: flex;
            flex-direction: column;
            align-items: inherit;
            justify-content: center;
            gap: 3px;
            text-align: inherit;
        }

        /* Botó destacat: Només sobreescriu allò que canvia, i la resta ho hereta */
        .boto.destacat {
            border-color: var(--color-primari);
            background: linear-gradient(145deg, var(--color-superficie), #1a1c2e);
        }
        
        .badge-ia {  /* Etiqueta d'IA */
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--color-primari);
            color: var(--color-text);
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 1px;
        }

        .badge-ia.suau {  /* Variant més suau */
            background: var(--color-icona-bg);
            color: var(--color-primari);
        }

        @media (max-width: 600px) {
            .top-bar {
                margin-bottom: 4px;
            }

            .capçalera {
                margin-bottom: 14px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .separador {
                margin-bottom: 20px;
            }

            .separador-text {
                letter-spacing: 2px;
                font-size: 0.75rem;
            }

            .cuadricula-botons {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .boto {
                flex-direction: row;
                align-items: center;
                justify-content: flex-start;
                gap: 16px;
                padding: 18px;
                border-radius: 18px;
                min-height: 88px;
            }

            .boto-icona {
                width: 64px;
                height: 64px;
                font-size: 1.8rem;
                flex-shrink: 0;
            }

            .boto-nom {
                font-size: 1.2rem;
                font-weight: 800;
                text-align: left;
            }

            .boto-desc {
                font-size: 0.9rem;
                text-align: left;
            }

            .boto-text {
                flex: 1;
                min-width: 0;
                align-items: flex-start;
                text-align: left;
            }

            .badge-ia {
                top: 10px;
                right: 10px;
            }
        }

    </style>
</head>

<body>
    <div class="main-container">
        <div class="top-bar">
            <a href="/admin" class="btn-admin" title="Configuració">⚙️</a>
        </div>
        
        <div class="capçalera">
            <div class="icona"> 🍸</div>
            <h1>Cocktail IA</h1>
        </div>
        <div class="separador">
            <div class="linia"></div>
            <div class="separador-text">Tria com vols el teu còctel</div>
            <div class="linia"></div>
        </div>
        <div class="cuadricula-botons">
            <a href="/manual" class="boto">
                <div class="boto-icona">📖</div>
                <div class="boto-text">
                    <div class="boto-nom">Manual</div>
                    <div class="boto-desc">Tria del catàleg complet</div>
                </div>
            </a>

            <a href="/aleatori" class="boto">
                <div class="boto-icona">🎲</div>
                <div class="boto-text">
                    <div class="boto-nom">Aleatori</div>
                    <div class="boto-desc">Deixa't sorprendre</div>
                </div>
            </a>

            <a href="/emocions" class="boto">
                <div class="badge-ia suau">IA</div>
                <div class="boto-icona">😊</div>
                <div class="boto-text">
                    <div class="boto-nom">Emocions</div>
                    <div class="boto-desc">La IA tria pel teu humor</div>
                </div>
            </a>

            <a href="/xat" class="boto destacat">
                <div class="badge-ia">IA</div>
                <div class="boto-icona">🤖</div>
                <div class="boto-text">
                    <div class="boto-nom">Xat</div>
                    <div class="boto-desc">Xateja i explica'm que vols</div>
                </div>
            </a>

        </div>
    </div>
</body>
</html>
