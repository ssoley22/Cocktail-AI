<!DOCTYPE html>             
<html lang="ca">         
<head>                       
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="/static/css/style.css"> 
    <title>Cocktail IA - Preparant...</title>   
    <style>
        body { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; /* Evitem l'scroll, aquesta pantalla ha de ser com un "Kiosk" pur */
        }

        .container { 
            text-align: center; 
            width: 90%; 
            max-width: 500px; 
            background: transparent; /* Anul·lem el fons de la classe .container global */
            border: none;
            box-shadow: none;
            padding: 0;
        }

        /* --- ELEMENTS TEXTUALS SUPERIORS --- */
        .cua-badge { 
            background: var(--color-icona-bg); 
            border: 1px solid var(--color-primari); 
            padding: 10px 25px; 
            border-radius: 50px; 
            color: var(--color-primari);
            font-weight: bold; 
            font-size: 1rem; 
            margin-bottom: 40px; 
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1#titol-estat { 
            color: var(--color-primari); 
            font-size: 3.5rem; 
            margin-bottom: 10px; 
            text-shadow: 0 0 30px var(--ombra-primari); 
        }

        .nom-coctel { 
            font-size: 1.8rem; 
            color: var(--color-text); 
            margin-bottom: 50px; 
            font-weight: 300; 
            opacity: 0.9;
        }

        /* --- ANIMACIÓ PREPARANT (GOT/COCTELERA) --- */
        .animacio-box {
            position: relative;
            height: 150px;
            margin-bottom: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .coctelera-emoji { 
            font-size: 6rem; 
            z-index: 10;
            animation: mix 0.6s infinite ease-in-out alternate; 
        }

        /* Les "gotes" o partícules màgiques del voltant */
        .gota {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--color-primari);
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 10px var(--color-primari-clar);
        }
        .gota.esq { left: 30%; animation: pugebaixa 1.5s infinite ease-in; }
        .gota.dre { right: 30%; animation: pugebaixa 1.5s infinite ease-in 0.7s; }
        .gota.cen { top: -20px; animation: pugebaixa 1.5s infinite ease-in 0.3s; }

        @keyframes mix {
            0% { transform: rotate(-15deg) translateY(0); }
            50% { transform: rotate(15deg) translateY(-15px); }
            100% { transform: rotate(-15deg) translateY(0); }
        }

        @keyframes pugebaixa {
            0% { transform: translateY(50px) scale(0.5); opacity: 0; }
            50% { transform: translateY(-30px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-80px) scale(0); opacity: 0; }
        }

        /* --- LÍNIA D'ESTATS (TEMPS REAL) --- */
        .estats-flux { 
            display: flex; 
            justify-content: space-between; 
            width: 100%; 
            position: relative; 
            padding: 0 20px;
        }

        .estat { 
            font-size: 0.85rem; 
            color: var(--color-text-subtil); 
            font-weight: bold; 
            transition: 0.5s; 
            position: relative; 
            z-index: 2; 
            background: var(--color-fons); /* Tapa la línia de sota per netejar el text */
            padding: 0 10px;
        }
        
        .estat.actiu { color: var(--color-primari); transform: scale(1.15); text-shadow: 0 0 10px var(--ombra-primari); }
        .estat.completat { color: var(--color-alegria); }

        /* Línia base i línia de progrés */
        .linia { position: absolute; top: 50%; left: 0; width: 100%; height: 3px; background: var(--color-vora); z-index: 1; transform: translateY(-50%); border-radius: 5px; }
        .linia-progress { position: absolute; top: 50%; left: 0; width: 0%; height: 3px; background: var(--color-primari); z-index: 1; transform: translateY(-50%); transition: width 1s ease-in-out; border-radius: 5px; box-shadow: 0 0 10px var(--color-primari); }

        /* --- PANTALLA SUPERPOSADA FINAL --- */
        #missatge-final { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(5, 5, 10, 0.95); /* Fons lleugerament transparent */
            backdrop-filter: blur(10px); /* Efecte cristal modern */
            z-index: 100; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            animation: fadeIn 0.8s forwards;
            text-align: center;
        }
        
        #missatge-final h1 {
            color: var(--color-alegria);
            font-size: 3rem;
            text-shadow: 0 0 30px var(--color-alegria-difuminat);
            margin-bottom: 20px;
        }

        #missatge-final .subtitol {
            color: var(--color-text);
            font-size: 1.5rem;
        }

        #missatge-final .compte-enrere {
            color: var(--color-text-subtil);
            font-size: 1rem;
            margin-top: 50px;
            letter-spacing: 1px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 600px) {
            .container {
                width: 100%;
                max-width: 100%;
            }

            .cua-badge {
                margin-bottom: 26px;
                font-size: 0.85rem;
                padding: 8px 14px;
            }

            .animacio-box {
                height: 120px;
                margin-bottom: 28px;
            }

            .coctelera-emoji {
                font-size: 4.5rem;
            }

            h1#titol-estat {
                font-size: 2.2rem;
            }

            .nom-coctel {
                font-size: 1.25rem;
                margin-bottom: 28px;
            }

            .estats-flux {
                padding: 0 8px;
            }

            .estat {
                font-size: 0.7rem;
                padding: 0 4px;
            }

            #missatge-final h1 {
                font-size: 2.1rem;
            }

            #missatge-final .subtitol {
                font-size: 1.1rem;
                padding: 0 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="cua-badge" id="cua-text">Ets el 1r de la cua</div>
        
        <div class="animacio-box">
            <div class="gota esq"></div>
            <div class="gota cen"></div>
            <div class="gota dre"></div>
            <div class="coctelera-emoji">🫨</div>
        </div>
        
        <h1 id="titol-estat">Preparant...</h1>
        <div class="nom-coctel">{{ coctel.Nom_Coctel }}</div>

        <div class="estats-flux">
            <div class="linia"></div>
            <div class="linia-progress" id="linia-prog"></div>
            <div class="estat actiu" id="estat-1">ESPERANT</div>
            <div class="estat" id="estat-2">SERVINT</div>
            <div class="estat" id="estat-3">LLEST!</div>
        </div>
    </div>

    <div id="missatge-final">
        <div style="font-size: 7rem; margin-bottom: 20px; animation: bounce 2s infinite alternate;">🍸</div>
        <h1>Beguda Llesta!</h1>
        <p class="subtitol">Gaudeix del teu <strong>{{ coctel.Nom_Coctel }}</strong></p>
        <p class="compte-enrere">Tornant a l'inici en 5 segons...</p>
    </div>

    <script>
        const estats = [
            { progress: "0%", text: "Esperant...", cua: "Posant gots..." },
            { progress: "50%", text: "Servint...", cua: "En procés..." },
            { progress: "100%", text: "Finalitzant...", cua: "Recull la beguda" }
        ];

        let index = 0;
        
        // Simulador de temps (Ara està a 5 segons per fase, es pot ajustar)
        const interval = setInterval(() => {
            index++;
            if (index < estats.length) {
                actualitzarEstat(index);
            } else {
                clearInterval(interval);
                mostrarFinal();
            }
        }, 5000); 

        function actualitzarEstat(i) {
            document.getElementById('titol-estat').innerText = estats[i].text;
            document.getElementById('cua-text').innerText = estats[i].cua;
            document.getElementById('linia-prog').style.width = estats[i].progress;
            
            // Canvia les classes de color del text inferior (Gris -> Lila -> Verd)
            document.querySelectorAll('.estat').forEach((el, idx) => {
                if (idx < i) el.className = "estat completat";
                if (idx === i) el.className = "estat actiu";
                if (idx > i) el.className = "estat";
            });
        }

        function mostrarFinal() {
            // Mostra el fons difuminat d'èxit
            document.getElementById('missatge-final').style.display = 'flex';
            
            // Després de 5 segons de la pantalla d'èxit, expulsa a l'inici
            setTimeout(() => {
                window.location.href = "/"; 
            }, 5000);
        }
    </script>

</body>
</html>
