<!DOCTYPE html>             
<html lang="ca">         
<head>                       
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="/static/css/style.css"> 
    <title>Cocktail IA - Comanda Confirmada</title>   
    <style>
        /* Ajustos específics pel tiquet heretant del teu style.css */
        
        .tiquet-box {
            background: var(--color-superficie-2); /* Fons lleugerament diferent del fons general */
            border: 2px dashed var(--color-primari); /* Vora més marcada */
            box-shadow: 0 15px 40px var(--ombra-primari-suau); /* Ombra per separar-ho del fons */
            margin-top: 5vh;
            padding: 50px 30px; /* Una mica més d'aire per dins */
        }

        .tiquet-titol {
            font-size: 2.6rem; /* Més gran */
            margin-bottom: 5px;
            color: var(--color-primari-clar);
            text-shadow: 0 0 20px var(--ombra-primari-suau); /* Lluentor al títol */
        }

        .nom-coctel {
            font-size: 1.1rem;
            color: var(--color-text-subtil); /* Color subtil com demanaves */
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-transform: uppercase; /* Li dona un toc molt pro */
        }

        .caixa-numero {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            /* Fons degradat subtil per donar volum */
            background: linear-gradient(145deg, var(--color-superficie-claret), var(--color-icona-bg));
            border: 2px solid var(--color-primari);
            border-radius: 50px; 
            padding: 15px 40px;
            margin-bottom: 30px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5), 0 0 25px var(--ombra-primari-suau); 
        }

        .numero {
            color: var(--color-text); /* Número en blanc perquè destaqui més sobre el lila */
            text-shadow: 0 0 15px var(--color-primari); /* Brillo lila al text blanc */
            font-size: 5rem; /* Un pèl més gran */
            font-family: 'Courier New', Courier, monospace; 
            font-weight: 900;
            line-height: 1;
        }

        .explicacio {
            font-size: 1.1rem;
            color: var(--color-text-subtil);
            line-height: 1.6;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        .explicacio span {
            color: var(--color-text); /* Destaquem parts clau de l'explicació */
            font-weight: bold;
        }

        .btn-inici {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 280px;
            background: var(--color-primari);
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 16px 20px;
            border-radius: 25px;
            transition: 0.3s;
            box-shadow: 0 5px 20px var(--ombra-primari-suau);
        }

        .btn-inici:hover {
            background: var(--color-primari-clar);
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <div class="main-container">
        
        <div class="container tiquet-box">
            
            <h1 class="tiquet-titol">Comanda Confirmada!</h1>
            <p class="nom-coctel">{{ coctel.Nom_Coctel }}</p>

            <div class="caixa-numero">
                <span class="numero">#{{ "%02d" | format(num) }}</span>
            </div>

            <p class="explicacio">
                Fixa't en la pantalla gran.<br> 
                Quan sigui el teu torn, apropa la teva targeta per pagar.
            </p>

            <a href="/" class="btn-inici">Tornar a l'inici</a>
            
        </div>

    </div>
</body>
</html>
