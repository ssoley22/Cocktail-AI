<!DOCTYPE html>             
<html lang="ca">         
<head>                       
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="/static/css/style.css"> 
    <title>Cocktail IA - Xat</title>   
    <style>
        .xat-wrapper {
            display: flex; flex-direction: column; width: 100%; max-width: 600px;
            height: calc(100vh - 80px); padding: 0 10px 20px 10px;
        }

        h1 { font-size: 2rem; text-align: center; margin-bottom: 20px; flex-shrink: 0; }

        #chat-box { flex: 1; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; padding-right: 5px; margin-bottom: 20px; }
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: var(--color-vora); border-radius: 10px; }

        .bombolla { padding: 15px 20px; border-radius: 20px; max-width: 85%; line-height: 1.5; word-break: break-word; }
        .bombolla.usuari { align-self: flex-end; background: var(--color-superficie-claret); border-bottom-right-radius: 5px; border: 1px solid var(--color-vora); }
        .bombolla.ia { align-self: flex-start; background: var(--color-superficie); border-bottom-left-radius: 5px; border: 1px solid var(--color-primari-suau); }

        .input-zona { flex-shrink: 0; display: flex; gap: 10px; background: var(--color-superficie); padding: 10px; border-radius: 30px; border: 1px solid var(--color-vora); align-items: flex-end; transition: 0.3s; }
        .input-zona:focus-within { border-color: var(--color-primari); box-shadow: 0 0 15px var(--ombra-primari-suau); }
        
        .input-zona textarea {
            flex: 1; background: transparent; border: none; color: var(--color-text); padding: 10px 15px;
            outline: none; font-size: 1rem; font-family: inherit; resize: none; 
            line-height: 1.5; height: 44px; max-height: 120px; box-sizing: border-box; overflow-y: auto;
        }
        .input-zona textarea::placeholder { color: var(--color-text-subtil); }
        .input-zona textarea::-webkit-scrollbar { width: 0px; }

        .btn-enviar { background: var(--color-primari); border: none; color: white; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .btn-enviar:hover { transform: scale(1.1); background: var(--color-primari-clar); box-shadow: 0 0 15px var(--ombra-primari); }

        .btn-reiniciar { display: none; width: 100%; background: var(--color-enfadat-difuminat); color: var(--color-error); border: 1px solid var(--color-error); padding: 18px; border-radius: 20px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; letter-spacing: 1px; transition: 0.3s; }
        .btn-reiniciar:hover { background: var(--color-error); color: white; }

        .targeta-ia { background: var(--color-superficie); border: 1px dashed var(--color-primari-suau); border-radius: 20px; padding: 25px; margin-top: 10px; text-align: center; width: 100%; max-width: 90%; align-self: center; box-shadow: 0 5px 20px var(--ombra-primari-suau); }
        .targeta-ia h3 { color: var(--color-primari); margin-bottom: 5px; font-size: 1.5rem; }
        .targeta-ia p { color: var(--color-text-subtil); font-style: italic; font-size: 0.9rem; margin-bottom: 15px; }

        .caixa-ingredients-ia { background: var(--color-superficie-2); border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 1px solid var(--color-vora); }
        .ing-ia-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--color-vora); font-size: 0.95rem; }
        .ing-ia-item:last-child { border-bottom: none; }
        .ing-ia-ml { color: var(--color-primari); font-weight: bold; }

        .btn-preparar-ia { display: block; width: 100%; background: var(--color-primari); color: white; padding: 15px; border-radius: 15px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-preparar-ia:hover { background: var(--color-primari-clar); transform: translateY(-2px); }

        .msg-counter { font-size: 0.8rem; color: var(--color-text-subtil); margin: -10px 0 5px 15px; align-self: flex-start; }
        .typing { display: flex; gap: 5px; justify-content: center; align-items: center; height: 24px; }
        .dot { width: 8px; height: 8px; background: var(--color-primari); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="top-bar">
            <a href="/" class="tornar-btn">← Tornar</a>
        </div>

        <div class="xat-wrapper">
            <h1>Explica'm què vols... 🤖</h1>

            <div id="chat-box">
                <div class="bombolla ia">
                    Hola! Soc la teva Cocktail IA. Digue'm com ha anat el dia o quins sabors t'agraden i et prepararé una recepta única.
                </div>
            </div>

            <div class="input-zona" id="input-group">
                <textarea id="user-input" rows="1" placeholder="Ex: Vull algo refrescant amb llimona..."></textarea>
                <button class="btn-enviar" id="send-btn" onclick="enviarMissatge()">➔</button>
            </div>
            
            <button class="btn-reiniciar" id="btn-reset-full" onclick="window.location.href='/reiniciar_xat'">
                S'han esgotat els missatges. REINICIAR XAT
            </button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const inputGroup = document.getElementById('input-group');
        const btnResetFull = document.getElementById('btn-reset-full');
        
        let restants = {{ restants | default(3) }};

        userInput.addEventListener('input', function() {
            this.style.height = '44px'; 
            this.style.height = Math.min(this.scrollHeight, 120) + 'px'; 
        });

        userInput.addEventListener('keydown', (e) => { 
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); 
                enviarMissatge(); 
            }
        });

        window.onload = function() {
            if (restants <= 0) activarModeReinici();
        }

        function activarModeReinici() {
            inputGroup.style.display = 'none';
            btnResetFull.style.display = 'block';
        }

        async function enviarMissatge() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = "";
            userInput.style.height = '44px'; 
            appendBubble('usuari', text);
            
            const typingId = "typing-" + Date.now();
            const typingBubble = document.createElement('div');
            typingBubble.className = "bombolla ia";
            typingBubble.id = typingId;
            typingBubble.innerHTML = '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            chatBox.appendChild(typingBubble);
            scrollDown();

            try {
                const res = await fetch('/api/generar_xat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ missatge: text })
                });
                
                const data = await res.json();
                chatBox.removeChild(typingBubble);

                if (data.status === "ok") {
                    appendBubble('ia', data.resposta);
                    
                    if (data.tinc_recepta && data.dades_coctel) {
                        appendCoctelCard(data.dades_coctel);
                    }
                    
                    restants = data.restants;
                    if (restants > 0) {
                        const textAjuda = data.tinc_recepta ? 
                            `Et queden ${restants} missatges si vols modificar la recepta.` : 
                            `Et queden ${restants} missatges`;
                        appendCounterText(textAjuda);
                    } else {
                        activarModeReinici();
                    }

                } else {
                    appendBubble('ia', "He tingut un problema amb la meva memòria. Prova de reiniciar.");
                    activarModeReinici();
                }
            } catch (e) {
                chatBox.removeChild(typingBubble);
                appendBubble('ia', "Error de connexió. Revisa la xarxa.");
            }
        }

        function appendBubble(cls, txt) {
            const div = document.createElement('div');
            div.className = "bombolla " + cls;
            div.innerText = txt; 
            chatBox.appendChild(div);
            scrollDown();
        }

        function appendCounterText(txt) {
            const div = document.createElement('div');
            div.className = "msg-counter";
            div.innerText = txt;
            chatBox.appendChild(div);
            scrollDown();
        }

        function appendCoctelCard(dades) {
            const card = document.createElement('div');
            card.className = "targeta-ia";
            
            let ingredientsHTML = '<div class="caixa-ingredients-ia">';
            if (dades.recepta) {
                for (const [liquid, ml] of Object.entries(dades.recepta)) {
                    ingredientsHTML += `
                    <div class="ing-ia-item">
                        <span>${liquid}</span>
                        <span class="ing-ia-ml">${ml}ml</span>
                    </div>`;
                }
            }
            ingredientsHTML += '</div>';

            card.innerHTML = `
                <h3>🍹 ${dades.nom}</h3>
                <p>${dades.descripcio || 'Fórmula única generada en temps real per la nostra IA.'}</p>
                ${ingredientsHTML}
                <a href="/confirmacio_ia" class="btn-preparar-ia">PREPARAR AQUEST CÒCTEL</a>
            `;
            chatBox.appendChild(card);
            scrollDown();
        }

        function scrollDown() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
